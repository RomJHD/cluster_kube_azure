- name: Prerequisites Kubernetes installation
  hosts: all
  become: true
  vars:
    cni_plugin_version: https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-amd64-v1.6.2.tgz
    regular_user: azureadm
    short_version: 1.31.*
    tigera_operator_yaml_url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/tigera-operator.yaml
    calico_yaml_url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
  roles:
    - kubernetes_common

- name: Configure Master Node
  hosts: master
  become: true
  vars:
    regular_user: azureadm
    short_version: 1.31.*
    tigera_operator_yaml_url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/tigera-operator.yaml
    calico_yaml_url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
    calico_vxlan_yaml_url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico-vxlan.yaml
    - kubernetes_master

- name: Configure Workers Nodes
  hosts: workers
  become: true
  vars:
    regular_user: azureadm
    short_version: 1.31.*
  roles:
    - kubernetes_workers

- name: Configure Metrics-server
  hosts: master
  roles:
    - kubernetes_metrics

- name: Check the result
  hosts: master
  become: true
  vars:
    regular_user: azureadm
  roles:
    - kubernetes_check


