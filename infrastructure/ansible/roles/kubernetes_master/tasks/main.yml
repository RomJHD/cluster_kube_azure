---
- name: Create an Empty file for Kubeadm configuring
  copy:
    content: ""
    dest: /etc/kubernetes/kubeadm-config.yaml
    force: no

- name: Configure container runtime
  blockinfile:
    path: /etc/kubernetes/kubeadm-config.yaml
    block: |
      kind: ClusterConfiguration
      apiVersion: kubeadm.k8s.io/v1beta3
      networking:
        podSubnet: "192.168.0.0/16"

      ---
      kind: KubeletConfiguration
      serverTLSBootstrap: true
      apiVersion: kubelet.config.k8s.io/v1beta1
      runtimeRequestTimeout: "15m"
      cgroupDriver: "systemd"
      systemReserved:
        cpu: 100m
        memory: 350M
      kubeReserved:
        cpu: 100m
        memory: 50M
      enforceNodeAllocatable:
      - pods

- name: Initialize the cluster
  shell: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml >> cluster_initialized.log
  args:
    chdir: /home/{{ regular_user }}
    creates: cluster_initialized.log
  register: kubeadm_init_result

- name: Create .kube directory
  become: yes
  become_user: "{{ regular_user }}"
  file:
    path: $HOME/.kube
    state: directory
    mode: 0755

- name: Copy admin.conf to User's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ regular_user }}/.kube/config
    remote_src: yes
    owner: "{{ regular_user }}"

- name: Export the config
  ansible.builtin.shell: "export KUBECONFIG=/home/azureadm/.kube/config"

- name: Install Tigera Operator
  become: yes
  become_user: "{{ regular_user }}"
  shell: kubectl create -f {{ tigera_operator_yaml_url }} >> pod_tigera_setup.log
  args:
    chdir: $HOME
    creates: pod_network_setup.log
  ignore_errors: true

