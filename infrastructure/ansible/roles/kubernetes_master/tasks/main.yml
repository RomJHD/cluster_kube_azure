- name: Install Calico VXLan
  become: yes
  become_user: "{{ regular_user }}"
  block:
    - name: Download Calico.yaml
      get_url:
        url: "{{ calico_vxlan_yaml_url }}"
        dest: "/tmp/calico-vxlan.yaml"
    - name: Apply Calico.yaml
      shell: kubectl apply -f /tmp/calico-vxlan.yaml >> pod_calico_setup.log
      args:
        chdir: $HOME
        creates: pod_calico_setup.log
      ignore_errors: true

- name: Forward IP persistently if required
# the below blocks has all tasks for ip forwarding both runtime and persistent
  block:
    - name: Forwarding the IP in sysctl
      lineinfile:
        path: /etc/sysctl.conf
        line: "net.ipv4.ip_forward=1"
        state: present
      register: forwarded 
    
    - name: Change the ip_forward for runtime
      shell: "sysctl -w net.ipv4.ip_forward=1"
      
    - name: Reloading the sysctl config
      shell: "sysctl -p /etc/sysctl.conf"
      when: forwarded is changed 
  when: ip_forward_result.stdout != '1'

- name: Restart kubelet service
  become: yes
  ansible.builtin.systemd:
    name: kubelet
    state: restarted

- name: Retrieve Join Command
  shell: kubeadm token create --print-join-command
  register: join_command_raw

- name: Set Join Command
  set_fact:
    join_command: "{{ join_command_raw.stdout_lines[0] }}"

- name: Download metrics-server components.yaml
  get_url:
    url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    dest: /tmp/components.yaml

- name: Get the master's hostname in lowercase
  shell: hostname | tr '[:upper:]' '[:lower:]'
  register: master_hostname
  changed_when: false

- name: Insert nodeName before containers line
  shell: |
    sed '/containers:/i\      nodeName: {{ master_hostname.stdout.strip() }}' /tmp/components.yaml > temp.yaml && sudo mv temp.yaml /tmp/components.yaml
  register: replace_result

- name: Apply the metrics-server manifest
  become: yes
  become_user: "{{ regular_user }}"
  shell: kubectl apply -f /tmp/components.yaml
  args:
    executable: /bin/bash
  ignore_errors: true
